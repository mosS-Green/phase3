name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: ./gradlew assembleDebug

      - name: Determine Version Name
        id: version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # Try to extract version if they wrote [release v1.2] etc
          if [[ "$COMMIT_MSG" =~ \[release\ (v?[0-9a-zA-Z.-]+)\] ]]; then
            REF_NAME="${BASH_REMATCH[1]}"
          else
            # Default to "latest-commitHash" if just [release] was written
            REF_NAME="latest-${GITHUB_SHA::7}"
          fi
          
          # Normalize
          echo "VERSION_NAME=$REF_NAME" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk Phase3-Tracker-${{ env.VERSION_NAME }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Phase3-Tracker-${{ env.VERSION_NAME }}.apk
          tag_name: ${{ env.VERSION_NAME }}
          name: Release ${{ env.VERSION_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
