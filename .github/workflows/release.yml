name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. v1.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release-keystore.jks

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          # Find the unsigned release APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          # Sign with apksigner (bundled in Android SDK on GitHub runners)
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)"

          ${BUILD_TOOLS_DIR}/apksigner sign \
            --ks ${{ github.workspace }}/release-keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$UNSIGNED_APK"

          # Verify the signature is valid
          ${BUILD_TOOLS_DIR}/apksigner verify --verbose \
            app/build/outputs/apk/release/app-release-signed.apk

      - name: Determine Version Name
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version_name }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="latest-${GITHUB_SHA::7}"
          fi

          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release-signed.apk Phase3-Tracker-${{ env.VERSION_NAME }}.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release-keystore.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Phase3-Tracker-${{ env.VERSION_NAME }}.apk
          tag_name: ${{ env.VERSION_NAME }}
          name: Release ${{ env.VERSION_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
